services:
  # ── PHP-FPM Application ──
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    container_name: tsbattery-app
    restart: unless-stopped
    env_file: .env.docker
    volumes:
      - app-storage:/var/www/html/storage/app
      - app-logs:/var/www/html/storage/logs
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app-network

  # ── Nginx Web Server ──
  nginx:
    build:
      context: .
      dockerfile: Dockerfile
      target: nginx
    container_name: tsbattery-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - app-storage:/var/www/html/storage/app
    depends_on:
      - app
    networks:
      - app-network

  # ── MySQL Database ──
  mysql:
    image: mysql:8.0
    container_name: tsbattery-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: landing_pin
      MYSQL_USER: tsbattery
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "${DB_DOCKER_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

volumes:
  mysql-data:
  app-storage:
  app-logs:

networks:
  app-network:
    driver: bridge
